name: Sync ALERJ Despesas DOCIGP (Banco de Perfil)

# Verba de gabinete da ALERJ pela API do DOCIGP → tabela alerj_despesas no
# BANCO DE PERFIL (legislatura atual, um lançamento por linha). Upsert pelo id
# do lançamento: rodar de novo não duplica. O DOCIGP é lento (~4 min no total).

on:
  schedule:
    - cron: '30 8 * * 1' # toda segunda, 08:30 UTC (05:30 BRT)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ALERJ Sync
        env:
          NEXT_PUBLIC_SUPABASE_PERFIL_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PERFIL_URL }}
          SUPABASE_PERFIL_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PERFIL_SERVICE_ROLE_KEY }}
        run: npm run sync:alerj
