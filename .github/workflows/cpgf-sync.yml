name: Sincronização CPGF (Mensal)

on:
  schedule:
    - cron: '0 3 1 * *' # Todo dia 1 do mês às 03:00 UTC
  workflow_dispatch: # Permite disparo manual pelo painel do GitHub

jobs:
  sync-cpgf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run ETL Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
        run: npx tsx scripts/etl/cpgf-sync.ts
