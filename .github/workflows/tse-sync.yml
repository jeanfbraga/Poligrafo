name: Sync TSE Bens
on:
  schedule:
    - cron: '0 2 * * 0' # Todo domingo as 02:00
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano eleitoral a sincronizar (ex: 2026, 2024, 2022, todos)'
        required: false
        default: '2026'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TSE Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/etl/tse-sync-real.ts --ano=${{ github.event.inputs.ano || '2026' }}


