name: Sync TSE Contas de Campanha (Banco de Perfil)

# Doadores (pessoa física) e fornecedores (CNPJ) das campanhas dos ELEITOS →
# tabela tse_campanha_contas no BANCO DE PERFIL, agregados por candidato +
# papel + documento (upsert idempotente: rodar de novo não duplica).
# Os ZIPs do TSE (até 1,3 GB) são baixados do CDN público a cada execução e
# descartados no fim: nada é guardado fora do banco.
# Depende de tse_eleitos (rode o sync de eleitos antes, no dia 3).

on:
  schedule:
    - cron: '0 8 4 * *' # dia 4 de cada mês, 08:00 UTC (05:00 BRT)
  workflow_dispatch:
    inputs:
      ano:
        description: 'Só um ciclo (2022 ou 2024). Vazio = todos.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TSE Contas de Campanha Sync
        env:
          NEXT_PUBLIC_SUPABASE_PERFIL_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PERFIL_URL }}
          SUPABASE_PERFIL_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PERFIL_SERVICE_ROLE_KEY }}
          ANO: ${{ github.event.inputs.ano }}
        run: |
          if [ -n "$ANO" ]; then
            npm run sync:tse-campanha -- --ano "$ANO" --gravar
          else
            npm run sync:tse-campanha -- --gravar
          fi
