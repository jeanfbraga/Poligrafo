name: SPU Imóveis da União ETL

on:
  schedule:
    # Roda todo dia 15 do mês, às 03:00 (UTC)
    - cron: '0 3 15 * *'
  workflow_dispatch:

jobs:
  sync-spu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run SPU ETL
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # SPU_CSV_URL pode ser sobrescrita nos secrets se o link oficial mudar
        SPU_CSV_URL: ${{ secrets.SPU_CSV_URL }} 
      run: npx tsx scripts/etl/spu-sync.ts
