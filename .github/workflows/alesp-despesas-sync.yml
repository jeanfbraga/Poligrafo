name: Sync ALESP Despesas (Banco de Perfil)

# Despesas de gabinete da ALESP (XML oficial, ~172 MB, atualizado todo dia) →
# tabela alesp_despesas no BANCO DE PERFIL, só a legislatura atual e agregado.
# Upsert idempotente: rodar de novo não duplica. O XML é lido em fluxo e não é guardado.

on:
  schedule:
    - cron: '0 8 * * 1' # toda segunda, 08:00 UTC (05:00 BRT)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ALESP Sync
        env:
          NEXT_PUBLIC_SUPABASE_PERFIL_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PERFIL_URL }}
          SUPABASE_PERFIL_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PERFIL_SERVICE_ROLE_KEY }}
        run: npm run sync:alesp
