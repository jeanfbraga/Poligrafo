name: Sync TSE Eleitos (Banco de Perfil)

# Eleitos e suplentes das casas legislativas (CSV nacional do TSE) → tabela
# tse_eleitos no BANCO DE PERFIL. Ciclos em scripts/etl/tse-eleitos.ts (CICLOS): chapas
# presidenciais 2002–2018, senadores 2018, 2022 (com quem exerceu mandato pela lista da
# ALERJ/ALESP) e 2024 (CPF pelo título de eleitor). Grava só o que mudou.
# Em ano de eleição o TSE atualiza o CSV com frequência: rode manualmente após a apuração.

on:
  schedule:
    - cron: '0 7 3 * *' # dia 3 de cada mês, 07:00 UTC (04:00 BRT)
  workflow_dispatch:
    inputs:
      ano:
        description: 'Só um ciclo (2002, 2006, 2010, 2014, 2018, 2022 ou 2024). Vazio = todos.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TSE Eleitos Sync
        env:
          NEXT_PUBLIC_SUPABASE_PERFIL_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PERFIL_URL }}
          SUPABASE_PERFIL_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PERFIL_SERVICE_ROLE_KEY }}
          ANO: ${{ github.event.inputs.ano }}
        run: |
          if [ -n "$ANO" ]; then
            npm run sync:tse-eleitos -- --ano "$ANO"
          else
            npm run sync:tse-eleitos
          fi
