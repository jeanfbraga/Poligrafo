name: Limpeza central dos bancos (retenção)

# Regras em scripts/etl/limpeza-central.ts: aplica só as ATIVAS; as "proposta" são
# apenas medidas e aparecem no resumo da execução até o dono aprovar.
on:
  schedule:
    # Toda segunda-feira, às 03:00 (UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permite execução manual pelo Github Actions

permissions:
  contents: read

jobs:
  cleanup_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Limpeza (regras ativas) e medição (propostas)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PERFIL_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_PERFIL_URL }}
          SUPABASE_PERFIL_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PERFIL_SERVICE_ROLE_KEY }}
        run: npm run sync:cleanup -- --aplicar
