# Avisos de bibliotecas com falha de segurança conhecida (projeto público).
# Só atualizações menores (minor/patch), agrupadas num PR por semana. Versões maiores
# (ex.: TypeScript 5 → 7) quebram o build e ficam para avaliação manual; correções de
# segurança chegam mesmo assim (dependabot_security_updates está ligado no repositório).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      acoes:
        patterns: ["*"]
