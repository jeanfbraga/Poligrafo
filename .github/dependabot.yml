# Avisos de bibliotecas com falha de segurança conhecida (projeto público).
# Atualizações de rotina ficam agrupadas num PR por semana para não gerar ruído.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      acoes:
        patterns: ["*"]
